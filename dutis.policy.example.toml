version = 1
approval_mode = "explicit"

# Omit an allowlist to permit any value. An empty list permits none.
allowed_extensions = ["md", "txt", "json"]
allowed_kinds = ["extension", "uti", "mime", "url_scheme"]
allowed_applications = ["com.microsoft.VSCode", "com.apple.TextEdit"]

# Optional ordered inputs for profile recommendations. Global preferences only
# reorder applications already in a profile. Extension preferences may add a
# team-standard application to that extension's candidate list.
[recommendations]
preferred_applications = ["com.microsoft.VSCode", "com.apple.TextEdit"]

[recommendations.extensions]
md = ["com.microsoft.VSCode"]
txt = ["com.apple.TextEdit", "com.microsoft.VSCode"]

# Typed preferences apply to every profile recommendation. A candidate is only
# proposed when the installed application declares the exact handler and a
# compatible role. URL schemes omit role because only "all" is valid.
[[recommendations.handlers]]
kind = "uti"
identifier = "public.plain-text"
role = "viewer"
applications = ["com.apple.TextEdit", "com.microsoft.VSCode"]

[[recommendations.handlers]]
kind = "mime"
identifier = "text/plain"
role = "editor"
applications = ["com.microsoft.VSCode", "com.apple.TextEdit"]

[[recommendations.handlers]]
kind = "url_scheme"
identifier = "vscode"
applications = ["com.microsoft.VSCode"]

# A protected extension may only remain on, or be restored to, this bundle ID.
[protected_associations]
pdf = "com.apple.Preview"

# Typed protected handlers can include a Launch Services role.
[[protected_handlers]]
kind = "uti"
identifier = "public.plain-text"
role = "viewer"
application = "com.apple.TextEdit"
