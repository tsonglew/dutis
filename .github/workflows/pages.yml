name: Website

on:
  push:
    branches:
      - master
    paths:
      - "website/**"
      - "scripts/generate_star_history.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      # GitHub requires collaborator-level repository access for star
      # timestamps. This short-lived token is never written to the SVG.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Generate star history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_star_history.py \
            --repository "${GITHUB_REPOSITORY}" \
            --output website/star-history.svg

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
