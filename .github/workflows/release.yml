name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v2.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Resolve release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_REF_TYPE: ${{ github.ref_type }}
          PUSHED_REF_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          release_tag="v${package_version}"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${INPUT_TAG}" != "${release_tag}" ]]; then
              echo "Requested tag ${INPUT_TAG} does not match Cargo version ${package_version}." >&2
              exit 1
            fi
            if ! git show-ref --tags --verify --quiet "refs/tags/${release_tag}"; then
              echo "Tag ${release_tag} does not exist." >&2
              exit 1
            fi
            should_release=true
          elif [[ "${PUSHED_REF_TYPE}" == "tag" ]]; then
            if [[ "${PUSHED_REF_NAME}" != "${release_tag}" ]]; then
              echo "Tag ${PUSHED_REF_NAME} does not match Cargo version ${package_version}." >&2
              exit 1
            fi
            should_release=true
          elif git show-ref --tags --verify --quiet "refs/tags/${release_tag}"; then
            echo "${release_tag} already exists; skipping release. Bump Cargo.toml to publish a new version."
            should_release=false
          else
            should_release=true
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "should_release=${should_release}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo version
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match Cargo version ${package_version}" >&2
            exit 1
          fi

      - name: Run quality checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked

  tag:
    name: Create release tag
    needs:
      - prepare
      - validate
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Create tag after validation
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "${RELEASE_TAG} was created by another run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${RELEASE_TAG}" "${RELEASE_SHA}" --message "Dutis ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

  build:
    name: Build universal macOS binary
    needs:
      - prepare
      - tag
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package universal binary
        run: |
          archive="dutis-${RELEASE_TAG}-macos-universal.tar.gz"
          mkdir -p dist/package
          lipo -create \
            target/aarch64-apple-darwin/release/dutis \
            target/x86_64-apple-darwin/release/dutis \
            -output dist/package/dutis
          chmod +x dist/package/dutis
          lipo -info dist/package/dutis
          tar -C dist/package -czf "dist/${archive}" dutis
          cd dist
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Verify archive checksum
        working-directory: dist
        run: sha256sum --check *.sha256

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Dutis ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
          overwrite_files: true
          draft: false
          prerelease: false

  homebrew:
    name: Update Homebrew tap
    needs:
      - prepare
      - publish
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Require tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${TAP_TOKEN}" ]]; then
            echo "Configure the HOMEBREW_TAP_TOKEN repository secret." >&2
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: tsonglew/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          version="${RELEASE_TAG#v}"
          archive="dutis-${RELEASE_TAG}-macos-universal.tar.gz"
          sha256="$(sha256sum "dist/${archive}" | awk '{print $1}')"
          url="https://github.com/tsonglew/dutis/releases/download/${RELEASE_TAG}/${archive}"
          ruby source/scripts/render_homebrew_formula.rb \
            "${version}" "${sha256}" "${url}" tap/Formula/dutis.rb

      - name: Commit and push formula
        working-directory: tap
        run: |
          if git diff --quiet -- Formula/dutis.rb; then
            echo "Formula is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dutis.rb
          git commit -m "Update dutis to ${RELEASE_TAG}"
          git push
