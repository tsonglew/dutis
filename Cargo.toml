[package]
name = "dutis"
version = "2.11.0"
edition = "2021"
rust-version = "1.88"
description = "A comprehensive macOS application File Extension Manager and default app setter written in Rust"
authors = ["Tsong Lew <tsonglew@gmail.com>"]
license = "MIT"
repository = "https://github.com/tsonglew/dutis"
homepage = "https://tsonglew.github.io/dutis/"
keywords = ["macos", "file-extensions", "applications", "uti", "default-apps"]
categories = ["command-line-utilities", "system"]

[[bin]]
name = "dutis"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
plist = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"

# Terminal output formatting
colored = "3.1"
