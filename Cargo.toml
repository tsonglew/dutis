[package]
name = "dutis"
version = "2.4.0"
edition = "2021"
rust-version = "1.88"
description = "A comprehensive macOS application File Extension Manager and default app setter written in Rust"
authors = ["Tsong Lew <tsonglew@gmail.com>"]
license = "MIT"
repository = "https://github.com/tsonglew/dutis"
keywords = ["macos", "file-extensions", "applications", "uti", "default-apps"]
categories = ["command-line-utilities", "system"]

[[bin]]
name = "dutis"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
plist = "1.10"

# Terminal output formatting
colored = "3.1"
